name: Sharing frontend image
on:
  push:
    branches: [master]
  workflow_dispatch:
permissions:
  contents: write
jobs:
  build:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
        with:
          version: 10
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm exec prettier --check src/components/ModalComponent.vue tests/sharing.cjs src/components/ShareModal.vue src/locales/en.json src/locales/ru.json
      - run: pnpm exec eslint src/components/ShareModal.vue src/components/ModalComponent.vue tests/sharing.cjs
      - run: pnpm build && ./localizefonts.sh
      - name: Browser sharing flow
        run: |
          npm install --prefix /tmp/sharing-browser --no-package-lock playwright@1.56.1
          /tmp/sharing-browser/node_modules/.bin/playwright install --with-deps chromium
          pnpm preview --host localhost > /tmp/preview.log 2>&1 &
          for i in $(seq 1 30); do curl -fsS http://localhost:4173/ >/dev/null && break; sleep 1; done
          NODE_PATH=/tmp/sharing-browser/node_modules node tests/sharing.cjs
      - run: mv dist dist-ci
      - uses: docker/setup-buildx-action@v3
      - uses: docker/build-push-action@v6
        with:
          context: .
          file: Dockerfile.ci
          load: true
          tags: piped-sharing-frontend:${{ github.sha }}
          labels: org.opencontainers.image.revision=${{ github.sha }}
      - name: Verify patched unprivileged runtime
        run: |
          image="piped-sharing-frontend:${GITHUB_SHA}"
          test "$(docker image inspect "$image" --format '{{.Config.User}}')" = 101
          docker run --rm --memory=64m --memory-swap=64m --cpus=0.5 --pids-limit=32 --entrypoint nginx "$image" -v 2>&1 | grep -F 'nginx/1.31.9'
          docker run -d --name frontend-smoke --memory=64m --memory-swap=64m --cpus=0.5 --pids-limit=32 -p 127.0.0.1:18080:8080 -e BACKEND_HOSTNAME=api.example.invalid -e HTTP_PORT=8080 -e HTTP_WORKERS=1 "$image"
          trap 'docker rm -f frontend-smoke' EXIT
          for i in $(seq 1 20); do
            if curl -fsS http://127.0.0.1:18080/ -o /tmp/frontend-smoke.html; then break; fi
            sleep 1
          done
          test -s /tmp/frontend-smoke.html
          docker exec frontend-smoke nginx -t
      - name: Export image
        run: |
          docker save piped-sharing-frontend:${GITHUB_SHA} | gzip -1 > image.tar.gz
          sha256sum image.tar.gz > image.tar.gz.sha256
          docker inspect --format '{{.Id}}' piped-sharing-frontend:${GITHUB_SHA} > image-id.txt
          printf '%s\n' "$GITHUB_SHA" > revision.txt
      - uses: actions/upload-artifact@v4
        with:
          name: frontend-image
          path: |
            image.tar.gz
            image.tar.gz.sha256
            image-id.txt
            revision.txt
      - name: Publish image bundle
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh release create "image-${GITHUB_SHA}" image.tar.gz image.tar.gz.sha256 image-id.txt revision.txt --title "Sharing frontend ${GITHUB_SHA:0:12}" --notes "Linux amd64 frontend image built from this revision. No instance configuration is included."
